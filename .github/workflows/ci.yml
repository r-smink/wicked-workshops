name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Zonder Directus valt de site terug op de vaste data; dat is genoeg
      # voor de build en voor de visuele test van de shell.
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            web/test-results/visual
            web/test-results/playwright
          retention-days: 7

  directus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: directus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: directus/package-lock.json

      - run: npm ci
      - run: npm run setup
      - run: npm test

      # Schone Directus uit snapshot.yaml, migraties, extensie en seed,
      # daarna de rechtenmatrix uit docs/03.
      - run: npm run verify

      - name: Typen gelijk aan het schema
        working-directory: web
        run: |
          npm ci
          npm run directus:types
          git diff --exit-code -- lib/directus/types.ts
